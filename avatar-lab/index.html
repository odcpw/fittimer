<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d11">
  <title>FitTimer Motion Lab</title>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header class="lab-header">
    <a class="brand" href="../" aria-label="Back to FitTimer">
      <span class="brand-mark" aria-hidden="true">↗</span>
      <strong><span>FitTimer</span> Motion Lab</strong>
    </a>
    <p><a class="lab-switch" href="wholebody-deadbug.html">Skinned SMPL-X dead bug →</a> · Drag to rotate · Scroll or pinch to zoom</p>
  </header>

  <main class="lab-shell">
    <aside class="exercise-rail" aria-label="Exercise animations">
      <h1>Michelle</h1>
      <div id="exercise-list" class="exercise-list"></div>
      <p class="rail-note">One skinned target. Three creator-sourced motion captures.</p>
    </aside>

    <section class="stage" aria-label="Interactive 3D exercise preview">
      <div id="canvas-host"></div>
      <div class="stage-copy">
        <strong id="movement-name">Loading model…</strong>
        <span id="movement-source"></span>
      </div>
      <p class="prototype-note">Visual mocap prototype · not yet biomechanical</p>
      <output id="load-state" class="load-state" aria-live="polite">Preparing skinned avatar…</output>
    </section>

    <section class="transport" aria-label="Animation playback controls">
      <button id="play-toggle" class="primary-control" type="button" disabled>Pause</button>
      <button id="restart" type="button" disabled>Restart</button>
      <button id="skeleton-toggle" type="button" aria-pressed="true" disabled>Joint rig</button>
      <span id="current-time" class="time">0:00.00</span>
      <label class="timeline-label">
        <span class="sr-only">Animation position</span>
        <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" disabled>
      </label>
      <span id="duration" class="time muted">0:00.00</span>
      <fieldset id="speed-controls" class="speed-controls" disabled>
        <legend class="sr-only">Playback speed</legend>
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1" class="is-active">1×</button>
        <button type="button" data-speed="1.5">1.5×</button>
      </fieldset>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="lab.mjs?v=5"></script>
</body>
</html>
