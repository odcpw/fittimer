<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTimer mocap preview</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b10; color: #eef; font: 14px system-ui; }
  #status { position: fixed; z-index: 2; top: 12px; left: 12px; padding: 8px 10px; border-radius: 7px; background: #080b10cc; }
  canvas { display: block; }
</style>
<div id="status">Loading avatar…</div>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const status = document.querySelector('#status');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080b10);
  scene.add(new THREE.HemisphereLight(0xdcecff, 0x263040, 3));
  const key = new THREE.DirectionalLight(0xffffff, 3);
  key.position.set(3, 5, 4);
  scene.add(key);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 100);
  camera.position.set(0, 1.1, 4.8);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.append(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.9, 0);
  controls.enableDamping = true;
  const grid = new THREE.GridHelper(6, 24, 0x526070, 0x202933);
  scene.add(grid);

  let mixer = null;
  const asset = new URLSearchParams(location.search).get('asset') || 'avatar.glb';
  new GLTFLoader().load(asset, (gltf) => {
    scene.add(gltf.scene);
    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      mixer.clipAction(gltf.animations[0]).play();
    }
    status.textContent = `${asset} · ${gltf.animations.length} animation clip(s)`;
  }, undefined, (error) => {
    status.textContent = `Failed to load ${asset}: ${error.message}`;
    console.error(error);
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    mixer?.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</html>
